server {
    listen 80;

    # Serve the web directory
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # Serve the audio directory
    # NOTE: this nginx.conf is not used by the current Express-only container;
    # autoindex is kept off as defense-in-depth for any future nginx deployment.
    location /audio {
        alias /usr/share/nginx/html/audio;
        autoindex off;
    }
}
