services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile.recorder
    restart: unless-stopped
    volumes:
      - ./audio:/usr/src/app/audio
      - ./data:/usr/src/app/data:ro
    environment:
      - TZ=Europe/Amsterdam
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 4500s (~75min) > the 60-min cron period, so a worker is flagged unhealthy
      # only once it misses a full tick (not merely between ticks).
      test: ["CMD", "node", "-e", "const fs=require('fs');const age=(Date.now()-fs.statSync('/tmp/heartbeat').mtimeMs)/1000;process.exit(age<4500?0:1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    volumes:
      - ./audio:/usr/src/app/audio
      # DELIBERATE OVERRIDE of the :ro requirement (design §2.1/§4): the worker
      # opens its own read-write DatabaseSync handle to flip job status
      # (pending->running->done|failed, skip marking, boot stale-lock reclaim),
      # so a :ro mount would throw SQLITE_READONLY on the first claim. The api
      # still owns every enqueue/config/schedule/prune write (NFR-1 intent).
      - ./data:/usr/src/app/data
    environment:
      - TZ=Europe/Amsterdam
    depends_on:
      api:
        condition: service_healthy
    # No networks: key — the worker joins the default compose network like the
    # recorder/cleaner/peakfilegenerator services it replaces. It reaches the DB
    # through the ./data file mount and the api only via depends_on health, never
    # over HTTP, so it needs no shared network (design §4).
    healthcheck:
      # Tightened window: the heartbeat runs on its own timer (design §2.3/§2.7)
      # decoupled from the poll-tick body, so it stays fresh through a long job.
      # age<30s catches a genuinely wedged worker fast without killing one that is
      # making steady progress through a backlog.
      test: ["CMD", "node", "-e", "const fs=require('fs');const age=(Date.now()-fs.statSync('/tmp/heartbeat').mtimeMs)/1000;process.exit(age<30?0:1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    volumes:
      - ./audio:/usr/src/app/audio
      - ./data:/usr/src/app/data
    environment:
      - TZ=Europe/Amsterdam
      - SESSION_SECRET=${SESSION_SECRET:-dev-insecure-session-secret-change-me}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    # Internal only: reached by nginx via http://api:3000. Not published.
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # nginx serves recorded audio straight from the shared volume (read-only).
      - ./audio:/usr/src/app/audio:ro
    ports:
      - "${PORT:-9703}:80"
    environment:
      - TZ=Europe/Amsterdam
    networks:
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  web-network:
