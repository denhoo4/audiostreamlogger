server {
    listen 80;

    # Serve the built React SPA. Client-side routing falls back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Serve recorded audio straight from the mounted volume.
    # autoindex OFF (prior security fix): never expose a directory listing.
    location /audio/ {
        alias /usr/src/app/audio/;
        autoindex off;
    }

    # Reverse-proxy the API routes to the dedicated api service (same origin,
    # so no CORS). The api service listens on port 3000 inside the network.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # SSE: do not batch /api/jobs/stream
        proxy_read_timeout 1h;    # SSE: keep the long-lived stream open
    }

    location /util/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
